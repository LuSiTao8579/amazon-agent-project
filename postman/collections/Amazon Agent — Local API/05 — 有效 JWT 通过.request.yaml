$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('返回真实用户且不含密码', () => pm.expect(pm.response.json()).to.have.all.keys('id', 'email', 'createdAt', 'updatedAt'));
    language: text/javascript
order: 5000
