$kind: http-request
url: "{{baseUrl}}/docs-json"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('文档包含健康检查与完整认证接口且不暴露密码哈希', () => { const doc = pm.response.json(); pm.expect(doc.paths).to.include.all.keys('/health', '/auth/signup', '/auth/login', '/auth/me'); pm.expect(doc.components.schemas.PublicUserDto.properties).not.to.have.property('passwordHash'); });
    language: text/javascript
order: 6000
