$kind: http-request
url: "{{baseUrl}}/docs-json"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('文档包含健康检查和 JWT 接口', () => { const paths = pm.response.json().paths; pm.expect(paths).to.have.property('/health'); pm.expect(paths).to.have.property('/auth/me'); });
    language: text/javascript
order: 6000
